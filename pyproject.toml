[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orcl-quant-lab"
version = "1.0.0"
description = "ORCL Quantitative Investment & AI Valuation Lab - an institutional-style equity research and quantitative research project on Oracle Corporation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "arch>=7.0",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "plotly>=5.20",
    "kaleido>=1.0",
    "matplotlib>=3.8",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
orcl-lab = "orcl_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
